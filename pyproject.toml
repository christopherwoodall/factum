[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factum-skill"
version = "0.2.0"
description = "Schema-driven, Git-portable evidence storage"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.16,<4",
    "jsonschema[format]>=4.23,<5",
    "referencing>=0.35,<1",
    "rapidfuzz>=3.10,<4",
]

[project.scripts]
factum = "factum_lib.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["factum_lib*"]